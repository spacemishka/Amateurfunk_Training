# GitLab CI/CD Pipeline für AmateurfunkTraining Android App
# Trigger: Automatisch bei jedem Git-Tag (z.B. v1.6.0)

stages:
  - test
  - build
  - release

variables:
  # Android SDK Installation im CI-Runner-Cache
  ANDROID_SDK_ROOT: "${CI_PROJECT_DIR}/.android-sdk"
  ANDROID_HOME: "${CI_PROJECT_DIR}/.android-sdk"
  # Gradle-Caching für schnellere Builds
  GRADLE_USER_HOME: "${CI_PROJECT_DIR}/.gradle"
  # AGP-Version aus libs.versions.toml (aktuell 9.4.0)
  AGP_VERSION: "9.4.0"

# Caching: Gradle-Caches und Android SDK zwischen Jobs teilen
.android_cache: &android_cache
  cache:
    key:
      files:
        - gradle/libs.versions.toml
        - gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/
      - .android-sdk/

# ──────────────────────────────────────────────────────────
# STAGE: test
# ──────────────────────────────────────────────────────────
unit-tests:
  stage: test
  image: eclipse-temurin:17-jdk-jammy
  <<: *android_cache
  # Nur bei Tags ausführen
  only:
    - tags
  before_script:
    - apt-get update -q && apt-get install -y -q wget unzip
    # Android Command-Line Tools herunterladen und installieren
    - mkdir -p "${ANDROID_HOME}/cmdline-tools"
    - wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O cmdline-tools.zip
    - unzip -q cmdline-tools.zip -d "${ANDROID_HOME}/cmdline-tools"
    - mv "${ANDROID_HOME}/cmdline-tools/cmdline-tools" "${ANDROID_HOME}/cmdline-tools/latest"
    - rm cmdline-tools.zip
    - export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
    # SDK-Lizenzen akzeptieren und Build-Tools + Platform installieren
    - yes | sdkmanager --licenses > /dev/null 2>&1
    - sdkmanager "platforms;android-37" "build-tools;35.0.2" "platform-tools" > /dev/null 2>&1
    - chmod +x gradlew
  script:
    - ./gradlew test --no-daemon
  artifacts:
    when: always
    paths:
      - app/build/reports/tests/
    reports:
      junit:
        - app/build/test-results/testDebugUnitTest/TEST-*.xml
    expire_in: 1 week

# ──────────────────────────────────────────────────────────
# STAGE: build
# ──────────────────────────────────────────────────────────
build-release-apk:
  stage: build
  image: eclipse-temurin:17-jdk-jammy
  <<: *android_cache
  only:
    - tags
  needs:
    - unit-tests
  before_script:
    - apt-get update -q && apt-get install -y -q wget unzip
    - mkdir -p "${ANDROID_HOME}/cmdline-tools"
    - wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O cmdline-tools.zip
    - unzip -q cmdline-tools.zip -d "${ANDROID_HOME}/cmdline-tools"
    - mv "${ANDROID_HOME}/cmdline-tools/cmdline-tools" "${ANDROID_HOME}/cmdline-tools/latest"
    - rm cmdline-tools.zip
    - export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
    - yes | sdkmanager --licenses > /dev/null 2>&1
    - sdkmanager "platforms;android-37" "build-tools;35.0.2" "platform-tools" > /dev/null 2>&1
    - chmod +x gradlew
  script:
    # Versionsnummer aus dem Git-Tag extrahieren (z.B. "v1.6.0" -> "1.6.0" oder "0.1" -> "0.1")
    - VERSION_NAME="${CI_COMMIT_TAG#v}"
    - VERSION_CODE=$(git rev-list --count HEAD 2>/dev/null || echo 1)
    - echo "Building version $VERSION_NAME (code $VERSION_CODE)"
    - |
      ./gradlew assembleRelease --no-daemon \
        -PversionName="$VERSION_NAME" \
        -PversionCode="$VERSION_CODE"
    # APK signieren (mit Keystore-Secret oder automatisch generiertem CI-Schlüssel)
    - |
      if [ -n "$KEYSTORE_BASE64" ]; then
        echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
        KS_PASS="${KEYSTORE_PASSWORD}"
        KS_ALIAS="${KEY_ALIAS}"
        KEY_PASS="${KEY_PASSWORD}"
      else
        echo "Kein Keystore konfiguriert – erstelle CI-Signierschlüssel..."
        keytool -genkeypair -v \
          -keystore release.keystore \
          -alias amateurfunk \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=AmateurfunkTraining, OU=App, O=SpaceMishka, C=DE"
        KS_PASS="android"
        KS_ALIAS="amateurfunk"
        KEY_PASS="android"
      fi
      BUILD_TOOLS_VERSION=$(ls "${ANDROID_HOME}/build-tools/" | tail -1)
      TARGET_APK="app/build/outputs/apk/release/AmateurfunkTraining-${VERSION_NAME}.apk"
      "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" sign \
        --ks release.keystore \
        --ks-pass "pass:${KS_PASS}" \
        --ks-key-alias "${KS_ALIAS}" \
        --key-pass "pass:${KEY_PASS}" \
        --v1-signing-enabled true \
        --v2-signing-enabled true \
        --v3-signing-enabled true \
        --out "$TARGET_APK" \
        app/build/outputs/apk/release/app-release-unsigned.apk
      rm -f release.keystore
      echo "APK signiert und verifiziert: $TARGET_APK"
      "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --verbose "$TARGET_APK"
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 90 days

# ──────────────────────────────────────────────────────────
# STAGE: release
# Erstellt ein GitLab Release mit der APK als Asset
# ──────────────────────────────────────────────────────────
create-gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  only:
    - tags
  needs:
    - build-release-apk
  variables:
    VERSION_NAME: "${CI_COMMIT_TAG#v}"
  script:
    - echo "Creating GitLab Release for tag ${CI_COMMIT_TAG}"
  release:
    name: "AmateurfunkTraining ${CI_COMMIT_TAG}"
    tag_name: "${CI_COMMIT_TAG}"
    description: |
      ## AmateurfunkTraining – Klasse E
      
      Release **${CI_COMMIT_TAG}** – automatisch erstellt durch GitLab CI.
      
      ### Installation
      APK-Datei herunterladen und auf einem Android-Gerät (API 31+) installieren.
      
      > **Hinweis**: Die APK muss eventuell manuell signiert werden, wenn kein Keystore konfiguriert ist.
    assets:
      links:
        - name: "AmateurfunkTraining-${VERSION_NAME}.apk"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/app/build/outputs/apk/release/AmateurfunkTraining-${VERSION_NAME}.apk?job=build-release-apk"
