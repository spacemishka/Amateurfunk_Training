name: Release APK Build

# Trigger: Wenn ein versionierter Tag (z.B. v1.6.0) gepusht wird
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-release-apk:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auschecken
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Vollständige Git-Historie für korrekten versionCode

      # 2. JDK 17 einrichten (Android Build-Anforderung)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle-Wrapper ausführbar machen
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Android SDK einrichten
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Versionsnummer aus dem Git-Tag extrahieren (z.B. "v1.6.0" -> "1.6.0")
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          VERSION_CODE=$(git tag --list 'v*.*.*' | wc -l)
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "version_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      # 6. Unit-Tests ausführen
      - name: Run unit tests
        run: ./gradlew test

      # 7. Release-APK kompilieren
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      # 8. APK signieren (nur wenn Keystore-Secrets konfiguriert sind)
      - name: Sign Release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools/" | tail -1)/apksigner sign \
            --ks release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/AmateurfunkTraining-${{ steps.version.outputs.version_name }}.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f release.keystore

      # 9. Unsigned APK umbenennen (wenn kein Keystore konfiguriert)
      - name: Rename unsigned APK
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mv app/build/outputs/apk/release/app-release-unsigned.apk \
             app/build/outputs/apk/release/AmateurfunkTraining-${{ steps.version.outputs.version_name }}-unsigned.apk

      # 10. GitHub Release erstellen und APK hochladen
      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: "AmateurfunkTraining v${{ steps.version.outputs.version_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
