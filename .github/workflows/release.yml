name: Release APK Build

# Trigger: Bei Tags (z.B. v1.6.0, v0.1, 0.1) oder manuell via GitHub UI
on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versionsname (z.B. 0.1 oder 1.0.0)'
        required: false
        default: '0.1'

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auschecken
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Vollständige Git-Historie für korrekten versionCode

      # 2. JDK 17 einrichten (Android Build-Anforderung)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle-Wrapper ausführbar machen
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Android SDK einrichten
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Versionsnummer extrahieren (z.B. "v1.6.0" -> "1.6.0" oder "0.1" -> "0.1")
      - name: Extract version
        id: version
        run: |
          RAW_TAG="${{ inputs.version_name }}"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          # 'v' am Anfang entfernen, falls vorhanden
          VERSION_NAME="${RAW_TAG#v}"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          
          # VersionCode: Gesamtzahl der Commits als aufsteigender Zähler (mindestens 1)
          VERSION_CODE=$(git rev-list --count HEAD 2>/dev/null || echo 1)
          if [ "$VERSION_CODE" -lt 1 ]; then
            VERSION_CODE=1
          fi
          
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION_NAME (versionCode: $VERSION_CODE)"

      # 6. Unit-Tests ausführen
      - name: Run unit tests
        run: ./gradlew test

      # 7. Release-APK kompilieren
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      # 8. APK signieren oder umbenennen
      - name: Process Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          APK_DIR="app/build/outputs/apk/release"
          SRC_APK=$(find "$APK_DIR" -maxdepth 1 -name "*.apk" | head -n 1)
          
          if [ -z "$SRC_APK" ]; then
            echo "Fehler: Keine APK-Datei in $APK_DIR gefunden!"
            exit 1
          fi
          
          echo "Gefundene APK: $SRC_APK"
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore gefunden – signiere APK..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | tail -1)
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks release.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$APK_DIR/AmateurfunkTraining-$VERSION_NAME.apk" \
              "$SRC_APK"
            rm -f release.keystore
            echo "APK erfolgreich signiert: $APK_DIR/AmateurfunkTraining-$VERSION_NAME.apk"
          else
            echo "Kein Keystore-Secret konfiguriert – APK bleibt unsigned."
            cp "$SRC_APK" "$APK_DIR/AmateurfunkTraining-$VERSION_NAME-unsigned.apk"
          fi

      # 9. GitHub Release erstellen und APK hochladen
      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.version_name != ''
        with:
          name: "AmateurfunkTraining v${{ steps.version.outputs.version_name }}"
          tag_name: ${{ github.ref_name || format('v{0}', steps.version.outputs.version_name) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/AmateurfunkTraining-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
